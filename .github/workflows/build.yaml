name: Build

on:
  push:
    branches: [main]
    paths:
      - "modbus_inverter/**"
      - "tests/**"
      - ".github/workflows/build.yaml"
  pull_request:
    paths:
      - "modbus_inverter/**"
      - "tests/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: modbustcp2mqtt
  ADDON_DIR: modbus_inverter

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Read the app version
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "${ADDON_DIR}/config.yaml" | head -1)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::No version found in ${ADDON_DIR}/config.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "App version: ${version}"

      - name: Check that the image name matches config.yaml
        run: |
          configured=$(sed -n 's/^image:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "${ADDON_DIR}/config.yaml" | head -1)
          expected="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          if [ "$configured" != "$expected" ]; then
            echo "::error::config.yaml image is '${configured}' but the workflow publishes '${expected}'"
            exit 1
          fi

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # To check out the code
      id-token: write # Write needed for Cosign signing (issue OIDC token for signing)
      packages: write # To push built images to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ env.ADDON_DIR }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          load: "true"
          push: ${{ github.event_name != 'pull_request' }}
          skip-existing: ${{ github.event_name != 'pull_request' && needs.init.outputs.version || '' }}
          version: ${{ needs.init.outputs.version }}

      - name: Smoke test the image
        run: tests/smoke.sh "${ADDON_DIR}" "${{ matrix.arch }}"

  manifest:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Write needed for Cosign signing (issue OIDC token for signing)
      packages: write # To push the manifest to GitHub Container Registry
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          skip-existing: ${{ needs.init.outputs.version }}
